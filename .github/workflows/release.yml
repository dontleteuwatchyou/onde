name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: onde-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: onde-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxcb-render0-dev \
            libxcb-xinput-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp target/${{ matrix.target }}/release/onde ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/onde.exe ${{ matrix.artifact }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Onde's updater refuses any binary without a valid signature (prehashed,
      # with a trusted comment "onde <version> <asset>"). Without this step every
      # release looks like "no update" to installed copies. Mirrors the local
      # scripts/release.sh: rsign with the passwordless project key (-W).
      - name: Sign binaries
        env:
          ONDE_SIGNING_KEY: ${{ secrets.ONDE_SIGNING_KEY }}
        run: |
          if [ -z "$ONDE_SIGNING_KEY" ]; then
            echo "::error::Secret ONDE_SIGNING_KEY manquant : release non signée, l'auto-update la refusera." >&2
            exit 1
          fi
          cargo install rsign2 --quiet
          printf '%s\n' "$ONDE_SIGNING_KEY" > onde.key
          version="${GITHUB_REF_NAME#v}"
          for asset in onde-linux-x86_64 onde-windows-x86_64.exe; do
            rsign sign -W -s onde.key -x "artifacts/$asset.minisig" \
              -t "onde $version $asset" "artifacts/$asset"
            rsign verify -p assets/update.pub -x "artifacts/$asset.minisig" "artifacts/$asset"
          done
          rm -f onde.key

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
