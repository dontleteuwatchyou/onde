[package]
name = "onde"
version = "0.2.0"
edition = "2024"
description = "Lecteur de musique natif pour Linux, en Rust et GPUI"
license = "MIT"
repository = "https://github.com/dontleteuwatchyou/onde"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
dirs = "7.0.0"
getrandom = "0.4.3"
gpui = "=0.2.2"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
lofty = "0.25.5"
md5 = "0.8.1"
minisign-verify = "0.3.0"
roxmltree = "0.21.2"
rpassword = "7.5.4"
rtrb = "0.4.1"
rustfft = "6.4.1"
self-replace = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smallvec = "1.16.4"
symphonia = { version = "0.6.1", features = ["all"] }
ureq = { version = "3.5.1", features = ["json"] }
walkdir = "2.5.0"
